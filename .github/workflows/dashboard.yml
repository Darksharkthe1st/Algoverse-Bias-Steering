name: Rebuild dashboard

on:
  push:
    paths:
      # The site is a projection of canonical state. Rebuild when that state moves.
      - 'PROJECT_STATE.md'
      - 'RESEARCH_CONTRACT.md'
      - 'WORK_LEDGER.md'
      - 'DECISION_LOG.md'
      - 'docs/PREREG.md'
      - 'runs/**'
      - 'tests/**'
      - 'scripts/build_dashboard.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild dashboard
        run: python3 scripts/build_dashboard.py --out dashboard/index.html

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html
          if git diff --cached --quiet; then
            echo "No dashboard changes."
          else
            git commit -m "ci: auto-rebuild dashboard [skip ci]"
            git push
          fi
